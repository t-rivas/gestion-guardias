<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gestión de guardias{% endblock %}</title>
    <script>
        (function () {
            const savedTheme = localStorage.getItem("guardias-theme");
            const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    <script src="{{ url_for('static', path='/js/theme.js') }}" defer></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <a class="brand" href="/" aria-label="Ir al inicio">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 9.5 12 5l8 4.5"></path>
                        <path d="M6 10.5h12"></path>
                        <path d="M7 19V11"></path>
                        <path d="M12 19V11"></path>
                        <path d="M17 19V11"></path>
                        <path d="M5 19h14"></path>
                    </svg>
                </span>
                <span>
                    <strong>Banco de Previsión Social</strong>
                    <small>Gestión de guardias</small>
                </span>
            </a>

            <nav class="main-nav" aria-label="Navegación principal">
                <a class="nav-link {% if request.url.path == '/' %}is-active{% endif %}" href="/">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="m3 10 9-7 9 7"></path>
                            <path d="M5 9v11h14V9M9 20v-6h6v6"></path>
                        </svg>
                    </span>
                    <span>Inicio</span>
                </a>
                <a class="nav-link {% if request.url.path == '/personas' %}is-active{% endif %}" href="/personas">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <circle cx="9" cy="8" r="3"></circle>
                            <path d="M3.5 20c.5-4 2.3-6 5.5-6s5 2 5.5 6"></path>
                            <path d="M16 5.5a3 3 0 0 1 0 5.8M17 14c2.2.7 3.4 2.7 3.7 6"></path>
                        </svg>
                    </span>
                    <span>Personas</span>
                </a>
                <a class="nav-link {% if request.url.path == '/disponibilidad' %}is-active{% endif %}" href="/disponibilidad">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                            <path d="M7 3v4M17 3v4M3 10h18M8 15l2.2 2.2L16 12"></path>
                        </svg>
                    </span>
                    <span>Disponibilidad</span>
                </a>
                <a class="nav-link {% if request.url.path == '/calendario' %}is-active{% endif %}" href="/calendario">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
                            <path d="M7 3v4M17 3v4M3 10h18M7 14h2M11 14h2M15 14h2M7 18h2M11 18h2M15 18h2"></path>
                        </svg>
                    </span>
                    <span>Calendario</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="content-container">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Activar modo nocturno" title="Activar modo nocturno">
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 15.4A8.5 8.5 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z"></path>
        </svg>
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
    </button>
    {% block scripts %}{% endblock %}
</body>
</html>
