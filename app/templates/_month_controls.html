<div class="month-controls">
    {% if has_previous %}
        <a class="icon-button"
           href="{{ month_action }}?year={{ previous_year }}&month={{ previous_month }}"
           aria-label="Ver mes anterior">‹</a>
    {% endif %}
    <form class="month-form" method="get" action="{{ month_action }}">
        <label class="visually-hidden" for="month">Mes</label>
        <select id="month" name="month">
            {% for number,label in month_options %}
                <option value="{{ number }}" {% if number==month %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <label class="visually-hidden" for="year">Año</label>
        <input id="year"
               type="number"
               name="year"
               min="1"
               max="9999"
               value="{{ year }}">
        <button class="button button-secondary" type="submit">Ver mes</button>
    </form>
    {% if has_next %}
        <a class="icon-button"
           href="{{ month_action }}?year={{ next_year }}&month={{ next_month }}"
           aria-label="Ver mes siguiente">›</a>
    {% endif %}
</div>
